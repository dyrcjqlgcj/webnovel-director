# truth/relationship_graph.yaml
#
# 记录人物、资源、事件、钩子之间的因果边。
# consistency-module 用此图检查关系链是否断裂。
#
# 字段：
#   source / target : 实体标识（人物.物品 / 地点.层级 / 钩子.id ...）
#   relation        : 关系描述
#   active_from     : 起始章号
#   active_until    : 终止章号（null=持续有效）
#   evidence        : 正文/线索来源
#
# 填写示例见注释行（以 # 开头）。

edges:
  - source: "{{PROTAGONIST}}"
    target: "{{CORE_MECHANISM}}"
    relation: "发现并利用"
    active_from: 1
    active_until: null
    evidence: "{{EVIDENCE_1}}"

  - source: "{{PROTAGONIST}}"
    target: "{{ANTAGONIST_FORCE}}"
    relation: "被追踪/限制"
    active_from: 1
    active_until: null
    evidence: "{{EVIDENCE_2}}"

