# webnovel-director configuration
# Copy this to config.local.yaml for local overrides (gitignored).

# ── LLM providers ─────────────────────────────────────────
providers:
  deepseek:
    base_url: "https://api.deepseek.com/v1/chat/completions"
    api_key_env: "DEEPSEEK_API_KEY"
    default_model: "deepseek-chat"
    api: "openai-completions"

  openai:
    base_url: "https://api.openai.com/v1/chat/completions"
    api_key_env: "OPENAI_API_KEY"
    default_model: "gpt-4o"
    api: "openai-completions"

  gptsapi:
    base_url: "https://api.gptsapi.net/v1/chat/completions"
    api_key_env: "GPTSAPI_API_KEY"
    default_model: "gpt-5.5"
    api: "openai-completions"

# ── Writing / review defaults ─────────────────────────────
writing:
  model: "deepseek-chat"
  provider: "deepseek"
  max_tokens: 8000
  timeout_s: 300
  temperature: 0.8

review:
  model: "deepseek-chat"
  provider: "deepseek"
  max_tokens: 4000
  timeout_s: 180
  temperature: 0.3

# ── Gate thresholds ────────────────────────────────────────
concept_gate:
  pass_threshold: 70
  warn_threshold: 50

outline_gate:
  max_iteration_rounds: 3
  auto_fix_enabled: true

# ── Directory layout (override if needed) ──────────────────
paths:
  director_dir: "director"
  truth_dir: "truth"
  story_dir: "story/outline"
  chapters_dirs: ["正文", "chapters"]

# ── Dashboard ──────────────────────────────────────────────
dashboard:
  port: 8765
  auto_refresh_s: 30
  theme: "dark"
